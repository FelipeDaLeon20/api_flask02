{% extends "layaout.html" %}
{% import "_macros.html" as datos_macro %}
{%block container%}


    <h1>Operaciones basicas</h1>
    <form action="" method="post">

        {{datos_macro.datos('numero1','Ingresa el numero 1')}}

        {{datos_macro.datos('numero2','Ingresa el numero 2')}}
        <div class="mb-3">
            <label for="operacion" class="form-label">Operacion</label>
            <select name="operacion" id="operacion" class="form-select">
            <option value="suma">suma</option>
            <option value="resta">resta</option>
            <option value="multiplicacion">multiplicacion</option>
            <option value="division">division</option>
            </select>
            
        </div>
        <button type="submit" class="btn btn-primary" >Calcular</button>
    </form>
    <h1>La {{nOp}} de {{numero1}} y {{numero2}}  = {{res}}</h1>

    {% endblock %}
